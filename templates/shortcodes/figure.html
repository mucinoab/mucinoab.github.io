<p>
  {% set meta_path = page.path~src %}

  {% if not meta_path is ending_with(".avif") %}
    {% set meta = get_image_metadata(path=src) %}
  {% endif %}

  <img src="{{ src }}"
        alt="{{ alt | default(value="") }}"

    {% if title %}
        title="{{ title }}"
    {% endif %}

    {% if width %}
        width="{{ width }}"
    {% elif meta.width %}
        width="{{ meta.width }}"
    {% endif %}

    {% if height %}
        height ="{{ height }}"
    {% elif meta.height %}
        height="{{ meta.height }}"
    {% endif %}

    {# Load first 2 images per page with high priority for better LCP (Largest Contentful Paint).
       The 'nth' variable tracks how many times this shortcode has been called on the current page.
       Remaining images are lazy loaded to improve initial page load performance. #}
    {% if nth <= 2 %}
    loading="eager"
    fetchpriority="high"
    {% else %}
    loading="lazy"
    {% endif %}
  />
</p>
